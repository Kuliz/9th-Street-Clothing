<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | 9th Street Clothing</title>
    <link rel="icon" type="image/png" href="9th street sign.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern Grid Styling */
        .vault-section {
            padding: 60px 0;
        }

        .section-title {
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Updated Accent to Green */
        .text-accent {
            color: #2ecc71; 
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        /* The Card Styling */
        .feature-card {
            background: #111;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #222;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            border-color: #2ecc71; /* Green hover border */
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.2);
        }

        .feature-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .feature-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: white;
        }

        .feature-card p {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Search Bar Styling */
        .search-container {
            margin: 40px auto;
            text-align: center;
            padding: 0 20px;
        }

        #productSearch {
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            border-radius: 50px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        #productSearch:focus {
            border-color: #2ecc71; /* Green focus border */
        }

        .divider {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #2ecc71, transparent);
            margin: 40px 0;
        }

        /* Updated Button to Green */
        .btn-primary {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: auto;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }
        
        .btn-primary:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="9th street sign.png" class="nav-logo"></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="payments.html">Payments</a></li>
                <li><a href="contact.html" class="nav-btn">Order Now</a></li>
                <li><button class="cart-toggle" type="button"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-badge" id="cartCount">0</span></button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="productSearch" placeholder="Search sneakers or apparel...">
        </div>

        <div class="category-filter" role="tablist" aria-label="Product categories">
            <button class="filter-pill active" data-category="all" type="button">All</button>
            <button class="filter-pill" data-category="footwear" type="button">Footwear</button>
            <button class="filter-pill" data-category="threads" type="button">Threads</button>
            <button class="filter-pill" data-category="tees" type="button">Tees</button>
            <button class="filter-pill" data-category="accessories" type="button">Accessories</button>
        </div>

        <!-- KICK VAULT -->
        <section class="vault-section" id="footwear-section">
            <div class="section-title">
                <h2>The Kick <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="footwear-grid"></div>
        </section>

        <hr class="divider">

        <!-- THREADS VAULT -->
        <section class="vault-section" id="threads-section">
            <div class="section-title">
                <h2>The Threads <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="threads-grid"></div>
        </section>

        <hr class="divider">

        <!-- Assorted tee vault -->
        <section class="vault-section" id="tees-section">
            <div class="section-title">
                <h2>Assorted Tee <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="tee-grid"></div>
        </section>

        <hr class="divider">

        <!-- ACCESSORIES VAULT -->
        <section class="vault-section" id="accessories-section">
            <div class="section-title">
                <h2>Accessories <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="accessories-grid"></div>
        </section>
    </div>

    <script>
        const kicks = [
            { name: "Yeezy slide", price: 200, img: "ys.png" },
            { name: "Classic crocs", price: 300, img: "cc.png" },
            { name: "Bayaband crocs", price: 250, img: "bc.png" },
            { name: "Yukon Vista II Clogs", price: 280, img: "yv.png" },
            { name: "Adidas adilette", price: 250, img: "as.png" },
            { name: "Nike benassi", price: 250, img: "ns.png" },
            { name: "Air jordan 1", price: 450, img: "j1h.png" },
            { name: "Air force 1", price: 425, img: "a1.png" },
            { name: "Vans off the wall", price: 250, img: "v.png" },
            { name: "Air jordan 11", price: 650, img: "aj11.png" }
        ];

        const threads = [
            { name: "Bape pink", price: 200, img: "bp.png" },
            { name: "Bape purple", price: 200, img: "bpu.png" },
            { name: "ChromeHearts orange", price: 200, img: "cho.png" },
            { name: "ChromeHearts pink", price: 200, img: "chp.png" },
            { name: "ChromeHearts black", price: 200, img: "chb.png" },
            { name: "PalmAngles black", price: 200, img: "pab.png" },
            { name: "PalmAngles brown", price: 200, img: "pabr.png" },
            { name: "PalmAngles white", price: 200, img: "paw.png" },
            { name: "Trapstar brown", price: 200, img: "tsb.png" },
            { name: "Bape miami pink", price: 200, img: "pbt.png" },
            { name: "Bape miami black", price: 200, img: "bbt.png" },
            { name: "Trapstar white", price: 200, img: "tsw.png"}
        ];

        const tee = [
            { name: "Newyork(A)", price: 200, img: "1.jpeg" },
            { name: "ChromeHearts(A)", price: 200, img: "2.jpeg" },
            { name: "Nike(A)", price: 200, img: "3.jpeg" },
            { name: "Newyork(B)", price: 200, img: "4.jpeg" },
            { name: "GAP", price: 200, img: "5.jpeg" },
            { name: "Bape", price: 200, img: "6.jpeg" },
            { name: "ChromeHearts(B)", price: 200, img: "7.jpeg" },
            { name: "Cactus Jack(A)", price: 200, img: "8.jpeg" },
            { name: "ChromeHearts(C)", price: 200, img: "9.jpeg" },
            { name: "ChromeHearts(D)", price: 200, img: "10.jpeg" },
            { name: "Corteiz", price: 200, img: "11.jpeg" },
            { name: "Supreme", price: 200, img: "12.jpeg" },
            { name: "Cactus Jack(B)", price: 200, img: "13.jpeg" },
            { name: "Nasa", price: 200, img: "14.jpeg" },
            { name: "Trapstar", price: 200, img: "15.jpeg" },
            { name: "Sume", price: 200, img: "16.jpeg"}
        ];

        const accessories = [
            { name: "Los Angeles red", price: 180, img: "A.png" },
            { name: "Los Angeles grey", price: 180, img: "AA.png" },
            { name: "Los Angeles blue", price: 180, img: "LA.png" },
            { name: "Philadelphia Phillies", price: 180, img: "P.png" },
            { name: "Chicago White Sox", price: 180, img: "sx.png" },
            { name: "New York Yankees", price: 180, img: "NY.png" }
        ];

        function displayProducts(filter = "", category = "all") {
            const fGrid = document.getElementById('footwear-grid');
            const tGrid = document.getElementById('threads-grid');
            const teeGrid = document.getElementById('tee-grid');
            const accGrid = document.getElementById('accessories-grid');
            const footwearSection = document.getElementById('footwear-section');
            const threadsSection = document.getElementById('threads-section');
            const teesSection = document.getElementById('tees-section');
            const accessoriesSection = document.getElementById('accessories-section');
            
            const searchLower = filter.toLowerCase();
            fGrid.innerHTML = "";
            tGrid.innerHTML = "";
            teeGrid.innerHTML = "";
            accGrid.innerHTML = "";

            const createCard = (p, categoryName = 'Featured') => `
                <div class="feature-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p class="card-price">K ${p.price.toLocaleString()}</p>
                    <div class="product-actions">
                        <button class="details-btn" type="button" data-name="${p.name}" data-price="${p.price}" data-image="${p.img}" data-category="${categoryName}" data-description="Premium curated piece selected for our latest collection." data-sizes="S, M, L, XL">View Details</button>
                        <button class="add-to-cart-btn" type="button" data-name="${p.name}" data-price="${p.price}" data-image="${p.img}">Add to Cart</button>
                    </div>
                </div>`;

            const filteredKicks = kicks.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredKicks.forEach(p => fGrid.innerHTML += createCard(p, 'Footwear'));

            const filteredThreads = threads.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredThreads.forEach(p => tGrid.innerHTML += createCard(p, 'Threads'));

            const filteredTees = tee.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredTees.forEach(p => teeGrid.innerHTML += createCard(p, 'Tees'));

            const filteredAcc = accessories.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredAcc.forEach(p => accGrid.innerHTML += createCard(p, 'Accessories'));

            const shouldShow = (section, hasItems) => category === 'all' || (category === 'footwear' && section === 'footwear') || (category === 'threads' && section === 'threads') || (category === 'tees' && section === 'tees') || (category === 'accessories' && section === 'accessories');
            const showFootwear = shouldShow('footwear', filteredKicks.length);
            const showThreads = shouldShow('threads', filteredThreads.length);
            const showTees = shouldShow('tees', filteredTees.length);
            const showAccessories = shouldShow('accessories', filteredAcc.length);

            footwearSection.style.display = showFootwear && filteredKicks.length ? 'block' : 'none';
            threadsSection.style.display = showThreads && filteredThreads.length ? 'block' : 'none';
            teesSection.style.display = showTees && filteredTees.length ? 'block' : 'none';
            accessoriesSection.style.display = showAccessories && filteredAcc.length ? 'block' : 'none';
        }

        document.getElementById('productSearch').addEventListener('input', (e) => {
            const activeCategory = document.querySelector('.filter-pill.active')?.getAttribute('data-category') || 'all';
            displayProducts(e.target.value, activeCategory);
        });

        document.querySelectorAll('.filter-pill').forEach((pill) => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach((item) => item.classList.remove('active'));
                pill.classList.add('active');
                const activeCategory = pill.getAttribute('data-category') || 'all';
                displayProducts(document.getElementById('productSearch').value, activeCategory);
            });
        });

        window.onload = () => displayProducts();
    </script>
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header">
            <h3>Your Cart</h3>
            <button class="qty-btn" id="closeCartBtn" type="button">Close</button>
        </div>
        <div class="cart-drawer-body" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Subtotal</span>
                <span id="cartSubtotal">K 0</span>
            </div>
            <div class="checkout-form">
                <label for="customerName">Name</label>
                <input id="customerName" type="text" placeholder="Your name">
                <label for="customerPhone">WhatsApp Number</label>
                <input id="customerPhone" type="text" placeholder="e.g. +260...">
            </div>
            <button class="checkout-btn" id="checkoutBtn" type="button">Checkout on WhatsApp</button>
        </div>
    </aside>

    <div class="modal-overlay" id="productModalOverlay"></div>
    <div class="product-modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="closeProductModal" type="button" aria-label="Close product details">×</button>
        <div class="product-modal-content">
            <img id="modalImage" src="" alt="Selected product">
            <div class="product-modal-body">
                <p class="badge" id="modalCategory">Featured</p>
                <h3 id="modalTitle">Product</h3>
                <p id="modalDescription">Detailed description will appear here.</p>
                <div class="modal-price" id="modalPrice">K 0</div>
                <div class="size-options">
                    <span>S</span><span>M</span><span>L</span><span>XL</span>
                </div>
                <div class="modal-actions">
                    <button class="btn-primary" id="modalAddToCart" type="button">Add to Cart</button>
                    <button class="btn-secondary" id="modalOrderWhatsApp" type="button">Quick Order</button>
                </div>
            </div>
        </div>
    </div>

    <script src="site.js"></script>
</body>
</html>
