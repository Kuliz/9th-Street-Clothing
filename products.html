<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | 9th Street Clothing</title>
    <link rel="icon" type="image/png" href="9th street sign.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern Grid Styling */
        .vault-section {
            padding: 60px 0;
        }

        .section-title {
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Updated Accent to Green */
        .text-accent {
            color: #2ecc71; 
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        /* The Card Styling */
        .feature-card {
            background: #111;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #222;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            border-color: #2ecc71; /* Green hover border */
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.2);
        }

        .feature-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .feature-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: white;
        }

        .feature-card p {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Search Bar Styling */
        .search-container {
            margin: 40px auto;
            text-align: center;
            padding: 0 20px;
        }

        #productSearch {
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            border-radius: 50px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        #productSearch:focus {
            border-color: #2ecc71; /* Green focus border */
        }

        .divider {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #2ecc71, transparent);
            margin: 40px 0;
        }

        /* Updated Button to Green */
        .btn-primary {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: auto;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }
        
        .btn-primary:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="9th street sign.png" class="nav-logo"></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="payments.html">Payments</a></li>
                <li><a href="contact.html" class="nav-btn">Order Now</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="productSearch" placeholder="Search sneakers or apparel...">
        </div>

        <!-- KICK VAULT -->
        <section class="vault-section">
            <div class="section-title">
                <h2>The Kick <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="footwear-grid"></div>
        </section>

        <hr class="divider">

        <!-- THREADS VAULT -->
        <section class="vault-section">
            <div class="section-title">
                <h2>The Threads <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="threads-grid"></div>
        </section>

        <hr class="divider">

        <!-- Assorted tee vault -->
        <section class="vault-section">
            <div class="section-title">
                <h2>Assorted Tee <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="tee-grid"></div>
        </section>

        <hr class="divider">

        <!-- ACCESSORIES VAULT -->
        <section class="vault-section">
            <div class="section-title">
                <h2>Accessories <span class="text-accent">Vault</span></h2>
            </div>
            <div class="feature-grid" id="accessories-grid"></div>
        </section>
    </div>

    <script>
        const kicks = [
            { name: "Yeezy slide", price: "K 200", img: "ys.png" },
            { name: "Classic crocs", price: "K 300", img: "cc.png" },
            { name: "Bayaband crocs", price: "K 250", img: "bc.png" },
            { name: "Yukon Vista II Clogs", price: "K 280", img: "yv.png" },
            { name: "Adidas adilette", price: "K 250", img: "as.png" },
            { name: "Nike benassi", price: "K 250", img: "ns.png" },
            { name: "Air jordan 1", price: "K 450", img: "j1h.png" },
            { name: "Air force 1", price: "K 425", img: "a1.png" },
            { name: "Vans off the wall", price: "K 250", img: "v.png" },
            { name: "J balvin rio jordan 3", price: "K 550", img: "j3.png" },
            { name: "Air jordan 11", price: "K 650", img: "aj11.png" }
        ];

        const threads = [
            { name: "Bape pink", price: "K 200", img: "bp.png" },
            { name: "Bape purple", price: "K 200", img: "bpu.png" },
            { name: "ChromeHearts orange", price: "K 280", img: "cho.png" },
            { name: "ChromeHearts pink", price: "K 280", img: "chp.png" },
            { name: "ChromeHearts black", price: "K 280", img: "chb.png" },
            { name: "PalmAngles black", price: "K 250", img: "pab.png" },
            { name: "PalmAngles brown", price: "K 250", img: "pabr.png" },
            { name: "PalmAngles white", price: "K 250", img: "paw.png" },
            { name: "Trapstar brown", price: "K 290", img: "tsb.png" },
            { name: "Bape miami pink ", price: "K 230", img: "pbt.png" },
            { name: "Bape miami black", price: "K 230", img: "bbt.png" },
            { name: "Trapstar white", price: "K 290", img: "tsw.png"}
        ];

        const tee = [
            { name: "Newyork(A)", price: "K 280", img: "1.jpeg" },
            { name: "ChromeHearts(A)", price: "K 290", img: "2.jpeg" },
            { name: "Nike(A)", price: "K 250", img: "3.jpeg" },
            { name: "Newyork(B)", price: "K 280", img: "4.jpeg" },
            { name: "GAP", price: "K 250", img: "5.jpeg" },
            { name: "Bape", price: "K 250", img: "6.jpeg" },
            { name: "ChromeHearts(B)", price: "K 280", img: "7.jpeg" },
            { name: "Cactus Jack(A)", price: "K 290", img: "8.jpeg" },
            { name: "ChromeHearts(C)", price: "K 290", img: "9.jpeg" },
            { name: "ChromeHearts(D)", price: "K 290", img: "10.jpeg" },
            { name: "Corteiz", price: "K 300", img: "11.jpeg" },
            { name: "Supreme", price: "K 260", img: "12.jpeg" },
            { name: "Cactus Jack(B)", price: "K 280", img: "13.jpeg" },
            { name: "Nasa", price: "K 275", img: "14.jpeg" },
            { name: "Trapstar", price: "K 280", img: "15.jpeg" },
            { name: "Sume", price: "K 300", img: "16.jpeg"}
        ];

        const accessories = [
            { name: "Los Angeles red", price: "K 250", img: "A.png" },
            { name: "Los Angeles grey", price: "K 250", img: "AA.png" },
            { name: "Los Angeles blue", price: "K 250", img: "LA.png" },
            { name: "Philadelphia Phillies", price: "K 250", img: "P.png" },
            { name: "Chicago White Sox", price: "K 250", img: "sx.png" },
            { name: "New York Yankees", price: "K 250", img: "NY.png" }
        ];

        function displayProducts(filter = "") {
            const fGrid = document.getElementById('footwear-grid');
            const tGrid = document.getElementById('threads-grid');
            const teeGrid = document.getElementById('tee-grid');
            const accGrid = document.getElementById('accessories-grid');
            
            const searchLower = filter.toLowerCase();

            // Clear all grids
            fGrid.innerHTML = "";
            tGrid.innerHTML = "";
            teeGrid.innerHTML = "";
            accGrid.innerHTML = "";

            const createCard = (p) => `
                <div class="feature-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p class="text-accent" style="margin-bottom: 15px;">${p.price}</p>
                    <a href="https://wa.me/260764462084?text=I'd like to buy ${p.name}" class="btn-primary">Order via WA</a>
                </div>`;

            // Filter and Render
            const filteredKicks = kicks.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredKicks.forEach(p => fGrid.innerHTML += createCard(p));

            const filteredThreads = threads.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredThreads.forEach(p => tGrid.innerHTML += createCard(p));

            const filteredTees = tee.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredTees.forEach(p => teeGrid.innerHTML += createCard(p));

            const filteredAcc = accessories.filter(p => p.name.toLowerCase().includes(searchLower));
            filteredAcc.forEach(p => accGrid.innerHTML += createCard(p));
            
            // Toggle Section Visibility
            fGrid.parentElement.style.display = filteredKicks.length ? "block" : "none";
            tGrid.parentElement.style.display = filteredThreads.length ? "block" : "none";
            teeGrid.parentElement.style.display = filteredTees.length ? "block" : "none";
            accGrid.parentElement.style.display = filteredAcc.length ? "block" : "none";
        }

        document.getElementById('productSearch').addEventListener('input', (e) => displayProducts(e.target.value));
        window.onload = () => displayProducts();
    </script>
</body>
</html>
